# Update codap3.concord.org/index-staging.html and codap3.concord.org/staging
name: Release v3 Staging
on:
  workflow_dispatch:
    inputs:
      version:
        description: The git tag for the version to use for index-staging.html
        required: true
env:
  BUCKET: models-resources
  PREFIX: codap3
  SRC_FILE: index-top.html
  workingDirectory: v3
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612297603577:role/codap
          aws-region: us-east-1
      - run: >
          aws s3 cp
          s3://${{ env.BUCKET }}/${{ env.PREFIX }}/version/${{ github.event.inputs.version }}/${{ env.SRC_FILE }}
          s3://${{ env.BUCKET }}/${{ env.PREFIX }}/index-staging.html
      - run: >
          aws s3 cp
          s3://${{ env.BUCKET }}/${{ env.PREFIX }}/version/${{ github.event.inputs.version }}/${{ env.SRC_FILE }}
          s3://${{ env.BUCKET }}/${{ env.PREFIX }}/staging
